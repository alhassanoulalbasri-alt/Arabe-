<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LexiArabe Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#C9A84C;--dark:#0A0E1A;--dark2:#111827;--dark3:#1C2535;--emerald:#0D5C3A;--text:#E8DFC8;--muted:#8A9BAE}
body{font-family:sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden}
#splash{position:fixed;inset:0;background:linear-gradient(145deg,var(--dark),var(--emerald),var(--dark));display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.5s}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{width:100px;height:100px;background:linear-gradient(135deg,var(--gold),#8B6914);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--dark);margin-bottom:20px}
.splash-title{font-size:28px;font-weight:900;color:var(--gold);margin-bottom:6px}
.splash-sub{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:30px}
.splash-bar{width:180px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
.splash-fill{height:100%;background:var(--gold);border-radius:2px;width:0;animation:fill 0.8s ease forwards}
@keyframes fill{to{width:100%}}
#app{display:none;flex-direction:column;min-height:100vh}
#app.show{display:flex}
.topbar{background:linear-gradient(135deg,#083D27,var(--dark2));padding:12px 16px;border-bottom:1px solid rgba(201,168,76,0.2);position:sticky;top:0;z-index:100}
.topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),#8B6914);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--dark)}
.brand-name{font-size:17px;font-weight:900;color:var(--gold)}
.brand-badge{font-size:9px;color:var(--gold);border:1px solid var(--gold);padding:2px 5px;border-radius:3px}
.prem-btn{background:linear-gradient(135deg,var(--gold),#8B6914);color:var(--dark);border:none;padding:7px 12px;border-radius:18px;font-size:11px;font-weight:700;cursor:pointer}
.search-wrap{position:relative}
.search-inp{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(201,168,76,0.2);border-radius:10px;padding:9px 12px 9px 36px;color:var(--text);font-size:13px;outline:none}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.tabs{display:flex;background:var(--dark2);border-bottom:1px solid rgba(255,255,255,0.05);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:11px 16px;font-size:12px;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.alpha-bar{display:flex;gap:5px;padding:8px 12px;background:var(--dark2);overflow-x:auto;scrollbar-width:none}
.alpha-bar::-webkit-scrollbar{display:none}
.alpha-btn{flex-shrink:0;width:32px;height:32px;border-radius:7px;background:var(--dark3);border:1px solid rgba(255,255,255,0.07);color:var(--text);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.alpha-btn.all{width:auto;padding:0 10px;font-size:11px;font-weight:600}
.alpha-btn.active{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.content{flex:1;padding:10px 14px 80px;overflow-y:auto;max-height:calc(100vh - 170px)}
.letter-hdr{display:flex;align-items:center;gap:10px;padding:8px 0;margin-bottom:6px}
.letter-big{font-size:36px;color:var(--gold);line-height:1}
.letter-info .letter-name{font-size:13px;font-weight:600}
.letter-info .letter-count{font-size:11px;color:var(--muted)}
.letter-line{flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.word-card{background:var(--dark3);border:1px solid rgba(255,255,255,0.05);border-radius:13px;padding:12px 14px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden}
.word-card.expanded{border-color:rgba(201,168,76,0.3)}
.word-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),#0D5C3A);opacity:0}
.word-card.expanded::before{opacity:1}
.wc-top{display:flex;align-items:center;justify-content:space-between}
.w-arabic{font-size:24px;color:var(--gold);direction:rtl}
.w-phonetic{font-size:11px;color:var(--muted);font-style:italic}
.w-badges{display:flex;gap:5px;align-items:center}
.badge{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(45,92,173,0.3);color:#7BA3E0;border:1px solid rgba(45,92,173,0.3)}
.fav-btn{background:none;border:none;cursor:pointer;font-size:17px}
.wc-trans{display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05)}
.word-card.expanded .wc-trans{display:block}
.trans-row{display:flex;gap:6px;margin-bottom:5px;font-size:12px}
.trans-flag{color:var(--muted);font-weight:700;min-width:22px}
.trans-fr{color:#90CDF4}
.trans-en{color:#9AE6B4}
.lock-box{background:linear-gradient(135deg,rgba(201,168,76,0.08),var(--dark3));border:2px dashed rgba(201,168,76,0.35);border-radius:12px;padding:16px;text-align:center;margin-bottom:8px}
.lock-box button{background:linear-gradient(135deg,var(--gold),#8B6914);color:var(--dark);border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px}
.phrase-card{background:linear-gradient(135deg,rgba(13,92,58,0.1),var(--dark3));border:1px solid rgba(13,92,58,0.25);border-radius:13px;padding:14px;margin-bottom:10px}
.phrase-arabic{font-size:20px;color:var(--gold);direction:rtl;text-align:right;margin-bottom:8px;line-height:1.6}
.phrase-trans{font-size:11px;margin-bottom:3px}
.phrase-cat{font-size:10px;font-weight:700;background:rgba(13,92,58,0.35);color:#5FB98A;padding:2px 8px;border-radius:8px;display:inline-block;margin-top:6px}
.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-chip{padding:5px 12px;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,0.08);background:var(--dark3);color:var(--muted)}
.cat-chip.active{background:var(--emerald);color:#fff;border-color:var(--emerald)}
.quiz-wrap{padding:8px 0}
.quiz-scores{display:flex;justify-content:center;gap:16px;margin-bottom:14px}
.score-box{background:var(--dark3);border-radius:10px;padding:10px 18px;text-align:center}
.score-num{font-size:26px;font-weight:900}
.score-num.g{color:var(--gold)}
.score-num.r{color:#E53E3E}
.score-label{font-size:10px;color:var(--muted)}
.quiz-card{background:var(--dark3);border:1px solid rgba(201,168,76,0.15);border-radius:16px;padding:20px;text-align:center;margin-bottom:16px}
.quiz-arabic{font-size:36px;color:var(--gold);margin-bottom:6px;line-height:1.4}
.quiz-q{font-size:13px;color:var(--muted)}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{background:var(--dark3);border:2px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px;font-size:13px;cursor:pointer;color:var(--text);font-family:sans-serif;text-align:left}
.quiz-opt.correct{background:rgba(13,92,58,0.25);border-color:#5FB98A;color:#5FB98A}
.quiz-opt.wrong{background:rgba(229,62,62,0.12);border-color:#E53E3E;color:#E53E3E}
.quiz-next{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),#8B6914);color:var(--dark);border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;display:none;font-family:sans-serif}
.quiz-next.show{display:block}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.prem-content{padding:0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--dark2);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:18px;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.35s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:0 auto 14px}
.plan-card{background:var(--dark3);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:16px;margin-bottom:10px}
.plan-card.rec{border-color:var(--gold);background:linear-gradient(135deg,rgba(201,168,76,0.06),var(--dark3))}
.plan-name{font-size:16px;font-weight:700;margin-bottom:3px}
.plan-price{font-size:24px;font-weight:900;color:var(--gold);margin-bottom:6px}
.plan-price span{font-size:12px;color:var(--muted);font-weight:400}
.plan-feat{list-style:none}
.plan-feat li{font-size:12px;color:var(--muted);padding:2px 0}
.plan-feat li::before{content:'✓ ';color:var(--gold)}
.plan-rec-badge{font-size:9px;font-weight:800;background:var(--gold);color:var(--dark);padding:3px 8px;border-radius:8px;display:inline-block;margin-bottom:8px}
.wa-btn{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;text-decoration:none;border-radius:11px;padding:13px 16px;margin-bottom:7px}
.wa-btn-name{font-size:13px;font-weight:700}
.wa-btn-price{font-size:11px;opacity:0.85}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pay-opt{background:var(--dark3);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:12px;text-align:center;cursor:pointer}
.pay-opt-icon{font-size:22px;margin-bottom:4px}
.pay-opt-name{font-size:11px;font-weight:600}
.pay-opt-num{font-size:10px;color:var(--muted)}
.act-box{background:linear-gradient(135deg,rgba(201,168,76,0.12),var(--dark3));border:2px solid var(--gold);border-radius:14px;padding:16px;margin-bottom:14px}
.act-title{font-size:15px;font-weight:800;color:var(--gold);text-align:center;margin-bottom:8px}
.act-inp{width:100%;background:rgba(0,0,0,0.35);border:1.5px solid rgba(201,168,76,0.4);border-radius:9px;padding:12px;color:#fff;font-size:14px;outline:none;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;box-sizing:border-box}
.act-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),#8B6914);color:var(--dark);border:none;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:sans-serif}
.act-msg{text-align:center;font-size:12px;margin-top:7px;min-height:16px;font-weight:600}
.prem-active{text-align:center;padding:20px 0 14px}
.prem-icon{font-size:52px;margin-bottom:10px}
.prem-plan-name{font-size:20px;font-weight:900;margin-bottom:4px}
.days-box{margin:14px auto;background:var(--dark3);border-radius:12px;padding:14px;max-width:220px;border:2px solid rgba(201,168,76,0.4)}
.days-num{font-size:38px;font-weight:900;color:var(--gold)}
.days-label{font-size:11px;color:var(--muted)}
.prog-bar{height:5px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:8px;overflow:hidden}
.prog-fill{height:100%;background:var(--gold);border-radius:3px}
.deact-btn{width:100%;padding:11px;background:rgba(229,62,62,0.08);border:2px solid #E53E3E;border-radius:10px;color:#E53E3E;font-size:13px;font-weight:700;cursor:pointer;font-family:sans-serif;margin-top:8px}
.admin-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),#8B6914);color:var(--dark);border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:sans-serif;margin-bottom:8px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--dark2);border-top:1px solid rgba(255,255,255,0.07);display:flex;z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 4px 7px;cursor:pointer;border:none;background:none;color:var(--muted)}
.nav-item.active{color:var(--gold)}
.nav-icon{font-size:19px;margin-bottom:2px}
.nav-label{font-size:9px;font-weight:600}
.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%) translateY(10px);background:#0D5C3A;color:#fff;padding:9px 18px;border-radius:18px;font-size:12px;z-index:999;opacity:0;transition:all 0.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stats-bar{display:flex;gap:7px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;background:var(--dark2)}
.stat-chip{flex-shrink:0;background:var(--dark3);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:5px 12px;font-size:11px;color:var(--muted)}
.stat-chip b{color:var(--gold)}
</style>
</head>

  if (_premiumLoading) {
    window._onPremiumLoad = function() { if (callback) callback(); };

  _premiumLoading = true;

// ══ CODE SYSTEM ══
function _h(s) {
  var h = 5381, ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = '';
  for (var i = 0; i < s.length; i++) { h = ((h<<5)+h)+s.charCodeAt(i); h = h&0xFFFFFFFF; }
  h = Math.abs(h);
  while (r.length < 4) { r += ch[h%ch.length]; h = Math.floor(h/ch.length); if (!h) h = 5381; }
  return r;
}
function validateCode(c) {
  c = c.trim().toUpperCase();
  if (c === 'ADMIN-629015548') return {plan:'Admin', expire:365000};
  if (c === 'LEXI-DEMO-FREE') return {plan:'Demo', expire:7};
  var p = c.split('-');
  if (p.length !== 3) return null;
  if (p[2] !== _h(p[0]+'-'+p[1]+'-'+SECRET)) return null;
  var m = {'LP':{plan:'Personnel',expire:30},'LM':{plan:'Etab. Mensuel',expire:30},'LA':{plan:'Etab. Annuel',expire:365}};
  return m[p[0]] || null;
}
function getPremiumStatus() {
  try {
    var d = JSON.parse(localStorage.getItem('lxa_p') || 'null');
    if (!d || new Date().getTime() > d.ex) { localStorage.removeItem('lxa_p'); return null; }
    return d;
  } catch(e) { return null; }
}
function daysLeft(s) {
  return s ? Math.ceil((s.ex - new Date().getTime()) / 86400000) : 0;
}
function activateCode(code) {
  var info = validateCode(code);
  if (!info) return {ok:false, msg:'Code invalide !'};
  var d = {code:code.trim().toUpperCase(), plan:info.plan, ex:new Date().getTime()+info.expire*86400000};
  localStorage.setItem('lxa_p', JSON.stringify(d));
  return {ok:true, msg:'Active ! Plan '+info.plan+' - '+info.expire+' jours'};
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function saveFavs() {
  localStorage.setItem('lxa_favs', JSON.stringify(STATE.favs));
  document.getElementById('favCount').textContent = STATE.favs.length;
}
function isFav(id) { return STATE.favs.indexOf(id) !== -1; }
function toggleFav(id) {
  var idx = STATE.favs.indexOf(id);
  if (idx !== -1) { STATE.favs.splice(idx,1); toast('Retiré des favoris'); }
  else { STATE.favs.push(id); toast('Ajouté aux favoris'); }
  saveFavs();
  var btn = document.getElementById('fav-'+id);
  if (btn) btn.textContent = isFav(id) ? '❤️' : '🤍';
}

// ══ TABS ══
function showTab(tab) {
  STATE.tab = tab;
  var views = ['words','phrases','favs','quiz','premium'];
  for (var i = 0; i < views.length; i++) {
    var v = document.getElementById('view-'+views[i]);
    var t = document.getElementById('tab-'+views[i]);
    var n = document.getElementById('nav-'+views[i]);
    if (v) v.style.display = (views[i] === tab) ? '' : 'none';
    if (t) t.classList[views[i] === tab ? 'add' : 'remove']('active');
    if (n) n.classList[views[i] === tab ? 'add' : 'remove']('active');
  }
  if (tab === 'words') renderWords();
  if (tab === 'phrases') renderPhrases();
  if (tab === 'favs') renderFavs();
  if (tab === 'quiz') renderQuiz();
  if (tab === 'premium') renderPremium();
}

}

function startQuiz(el) {
  var allWords = [];
  for (var li = 0; li < LETTERS.length; li++) {
    var ws = WORDS[LETTERS[li]] || [];
    for (var wi = 0; wi < ws.length; wi++) {
      if (ws[wi][2] && ws[wi][2].length < 30) allWords.push(ws[wi]);
    }
  }
  var word = allWords[Math.floor(Math.random()*allWords.length)];
  var wrongs = [];
  while (wrongs.length < 3) {
    var rnd = allWords[Math.floor(Math.random()*allWords.length)];
    if (rnd !== word && wrongs.indexOf(rnd) === -1) wrongs.push(rnd);
  }
  var opts = wrongs.concat([word]).sort(function(){ return Math.random()-0.5; });
  var pct = STATE.quiz.correct + STATE.quiz.wrong > 0 ? Math.round(STATE.quiz.correct/(STATE.quiz.correct+STATE.quiz.wrong)*100) : 0;
  var html = '<div class="quiz-scores">'+
    '<div class="score-box"><div class="score-num g">'+STATE.quiz.correct+'</div><div class="score-label">✓ Correct</div></div>'+
    '<div class="score-box"><div class="score-num" style="color:var(--muted)">'+(STATE.quiz.correct+STATE.quiz.wrong)+'</div><div class="score-label">Total</div></div>'+
    '<div class="score-box"><div class="score-num r">'+STATE.quiz.wrong+'</div><div class="score-label">✗ Faux</div></div>'+
  '</div>'+
  '<div class="quiz-card">'+
    '<div class="quiz-arabic">'+word[0]+'</div>'+
    '<div style="font-size:12px;color:var(--muted)">'+word[1]+'</div>'+
    '<div class="quiz-q">Traduction en français?</div>'+
    '<div style="font-size:11px;color:var(--gold);margin-top:4px">Précision: '+pct+'%</div>'+
  '</div>'+
  '<div class="quiz-opts" id="qOpts">';
  for (var i = 0; i < opts.length; i++) {
    html += '<button class="quiz-opt" onclick="answerQ(this,\''+opts[i][2]+'\',\''+word[2]+'\')">'+opts[i][2]+'</button>';
  }
  html += '</div><button class="quiz-next" id="qNext" onclick="nextQ()">Question suivante ➜</button>';
  el.innerHTML = html;
  STATE.quiz.currentWord = word;
  STATE.quiz.answered = false;
  if (!STATE.premium) STATE.quiz.freeCount++;
  document.getElementById('quizScore').textContent = STATE.quiz.correct;
}
function answerQ(btn, chosen, correct) {
  if (STATE.quiz.answered) return;
  STATE.quiz.answered = true;
  var opts = document.querySelectorAll('.quiz-opt');
  for (var i = 0; i < opts.length; i++) opts[i].style.pointerEvents = 'none';
  if (chosen === correct) {
    btn.classList.add('correct');
    STATE.quiz.correct++;
    toast('✓ Correct ! Bravo !');
  } else {
    btn.classList.add('wrong');
    STATE.quiz.wrong++;
    for (var i = 0; i < opts.length; i++) {
      if (opts[i].textContent === correct) opts[i].classList.add('correct');
    }
    toast('✗ Incorrect');
  }
  var nx = document.getElementById('qNext');
  if (nx) nx.classList.add('show');
  document.getElementById('quizScore').textContent = STATE.quiz.correct;
}
function nextQ() {
  var el = document.getElementById('quizArea');
  if (el) startQuiz(el);
}

function sendCode(code, plan, expire) {
  var used = JSON.parse(localStorage.getItem('lxa_used') || '[]');
  if (used.indexOf(code) === -1) { used.push(code); localStorage.setItem('lxa_used', JSON.stringify(used)); }
  var planStr = plan || 'Premium';
  var expireStr = expire || '30';
  var msg = encodeURIComponent(
    'Bonjour ! Votre acces LexiArabe Pro est pret !\n\n' +
    'Code : ' + code + '\n' +
    'Plan : ' + planStr + '\n' +
    'Duree : ' + expireStr + ' jours\n\n' +
    'Comment activer :\n' +
    '1. Ouvrez LexiArabe Pro\n' +
    '2. Appuyez sur Premium\n' +
    '3. Entrez le code\n' +
    '4. Appuyez ACTIVER\n\n' +
    'Bonne etude ! 📚'
  );
  window.open('https://wa.me/?text='+msg, '_blank');
  toast('Code envoyé : '+code);
}

function doSearch(val) {
  STATE.query = val;
  if (STATE.tab === 'words') renderWords();
}

window.addEventListener('load', function() {
  STATE.premium = getPremiumStatus();
  if (STATE.premium) {
    loadPremiumWords(function() {
      loadPremiumPhrases(function() {
        loadPremiumDict(function() { renderWords(); });
      });
    });
  }
  buildAlpha();
  document.getElementById('favCount').textContent = STATE.favs.length;
  setTimeout(function() {
    document.getElementById('splash').classList.add('hide');
    document.getElementById('app').classList.add('show');
    renderWords();
  }, 400);
});
